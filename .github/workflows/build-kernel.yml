name: Build A135M/A135F OC Max Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex libelf-dev libssl-dev \
            libncurses5-dev python-is-python3 python2 python3 zip unzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-a13-${{ github.run_id }}
          restore-keys: |
            ccache-a13-

      - name: Build kernel & AnyKernel3 zip
        run: |
          mkdir -p out
          chmod +x build_kernel.sh
          set -o pipefail
          bash build_kernel.sh 2>&1 | tee out/build.log

      - name: Upload flashable AnyKernel3 zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physwizz-A135-OC-Max
          path: |
            out/physwizz-A135-OC-Max.zip
            out/Image
            out/exynos3830.dtb
            out/build.log
